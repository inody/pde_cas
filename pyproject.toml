[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pde-cas"
version = "0.1.0"
description = "Reproducible controllability allocation scores for PDEs"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = ["numpy==2.5.1", "scipy==1.18.0", "matplotlib==3.11.0"]

[project.scripts]
pde-cas = "pde_cas.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pde_cas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
